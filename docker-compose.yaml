services:
  db:
    image: postgres:17-alpine
    container_name: contact-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: contact_manager
      POSTGRES_PASSWORD: contact_manager
      POSTGRES_DB: contact_manager
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contact_manager -d contact_manager"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db-data:
